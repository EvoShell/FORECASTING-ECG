services:
  api:
    build:
      context: ..
      dockerfile: ecg_forecast_api/Dockerfile
    ports:
      - "8000:8000"
    environment:
      # El Dockerfile copia results/NB5/modelos, que es donde esta el modelo final.
      # Antes apuntaba a NB4B, carpeta que no existe en la imagen.
      - MODEL_DIR=/app/results/NB5/modelos
      - LOG_LEVEL=INFO
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 2G
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  frontend:
    build:
      context: ../ecg-react
      args:
        VITE_API_URL: ""
    ports:
      - "80:80"
    depends_on:
      - api
    restart: unless-stopped
