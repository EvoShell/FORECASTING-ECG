server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Forzar UTF-8 en todos los archivos de texto (CSV, JSON, JS, HTML)
    charset utf-8;
    charset_types text/plain text/csv application/json text/javascript
                  application/javascript text/xml text/css text/html;

    client_max_body_size 50M;

    # Proxy todas las llamadas /api/* al servicio backend
    location /api/ {
        proxy_pass         http://api:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # SPA fallback: cualquier ruta que no sea un archivo estático carga index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Compresión gzip para assets
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript
               application/wasm;
    gzip_min_length 1024;
}
