<svg viewBox="0 0 1000 820" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Estructura de carpetas del repositorio: notebooks, requirements, gitignore y README en la raíz; el subdirectorio Dashboard contiene el backend ecg_forecast_api (FastAPI) y el frontend ecg-react (React), cada uno con sus archivos de configuración y código fuente.">
