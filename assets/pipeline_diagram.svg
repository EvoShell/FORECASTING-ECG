<svg viewBox="0 0 1000 740" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Flujo del sistema en 4 pasos: el historial de 5 latidos más el intervalo RR entra a los modelos de forecasting (ML clásico evolucionando a Deep Learning), que producen la predicción de latidos futuros, la cual alimenta la detección anticipada de anomalías en el dashboard.">
  <style id="tema-oscuro-generado">
    /* La paleta clara queda intacta: aqui solo se reasigna cuando el
       navegador informa de que el tema del sistema es oscuro. */
    @media (prefers-color-scheme: dark) {
      [fill="#047857"]  { fill:   #34d399; }
      [stroke="#047857"]{ stroke: #34d399; }
      [fill="#059669"]  { fill:   #34d399; }
      [stroke="#059669"]{ stroke: #34d399; }
      [fill="#0f172a"]  { fill:   #e6edf3; }
      [stroke="#0f172a"]{ stroke: #e6edf3; }
      [fill="#1e40af"]  { fill:   #60a5fa; }
      [stroke="#1e40af"]{ stroke: #60a5fa; }
      [fill="#2563eb"]  { fill:   #6aa6ff; }
      [stroke="#2563eb"]{ stroke: #6aa6ff; }
      [fill="#334155"]  { fill:   #c9d1d9; }
      [stroke="#334155"]{ stroke: #c9d1d9; }
      [fill="#4338ca"]  { fill:   #8b8ff0; }
      [stroke="#4338ca"]{ stroke: #8b8ff0; }
      [fill="#475569"]  { fill:   #b8c0c9; }
      [stroke="#475569"]{ stroke: #b8c0c9; }
      [fill="#4f46e5"]  { fill:   #8b8ff0; }
      [stroke="#4f46e5"]{ stroke: #8b8ff0; }
      [fill="#64748b"]  { fill:   #8b949e; }
      [stroke="#64748b"]{ stroke: #8b949e; }
      [fill="#be123c"]  { fill:   #fb7185; }
      [stroke="#be123c"]{ stroke: #fb7185; }
      [fill="#bfdbfe"]  { fill:   #2d4a73; }
      [stroke="#bfdbfe"]{ stroke: #2d4a73; }
      [fill="#c7d2fe"]  { fill:   #3b4270; }
      [stroke="#c7d2fe"]{ stroke: #3b4270; }
      [fill="#cbd5e1"]  { fill:   #3d444d; }
      [stroke="#cbd5e1"]{ stroke: #3d444d; }
      [fill="#d1fae5"]  { fill:   #1c4034; }
      [stroke="#d1fae5"]{ stroke: #1c4034; }
      [fill="#e0e7ff"]  { fill:   #2a2f45; }
      [stroke="#e0e7ff"]{ stroke: #2a2f45; }
      [fill="#e11d48"]  { fill:   #fb7185; }
      [stroke="#e11d48"]{ stroke: #fb7185; }
      [fill="#e2e8f0"]  { fill:   #30363d; }
      [stroke="#e2e8f0"]{ stroke: #30363d; }
      [fill="#ecfdf5"]  { fill:   #0d2820; }
      [stroke="#ecfdf5"]{ stroke: #0d2820; }
      [fill="#eef2ff"]  { fill:   #1a1d2e; }
      [stroke="#eef2ff"]{ stroke: #1a1d2e; }
      [fill="#eff6ff"]  { fill:   #172033; }
      [stroke="#eff6ff"]{ stroke: #172033; }
      [fill="#f1f5f9"]  { fill:   #21262d; }
      [stroke="#f1f5f9"]{ stroke: #21262d; }
      [fill="#f8fafc"]  { fill:   #1c2128; }
      [stroke="#f8fafc"]{ stroke: #1c2128; }
      [fill="#ffe4e6"]  { fill:   #3d1f24; }
      [stroke="#ffe4e6"]{ stroke: #3d1f24; }
      [fill="#fff1f2"]  { fill:   #2b1418; }
      [stroke="#fff1f2"]{ stroke: #2b1418; }
      [fill="#ffffff"]  { fill:   #161b22; }
      [stroke="#ffffff"]{ stroke: #161b22; }
    }
  </style>
  <defs>
    <filter id="pf-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2.5" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <marker id="pf-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <marker id="pf-arrowSmall" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4f46e5"/>
    </marker>
    <symbol id="pf-i-pulse" viewBox="0 0 24 24">
      <polyline points="1,13 6,13 9,4 13,21 16,8 18,13 23,13" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
    <symbol id="pf-i-network" viewBox="0 0 24 24">
      <path d="M5,7 L12,12 M5,17 L12,12 M12,12 L19,7 M12,12 L19,17" stroke="currentColor" stroke-width="1.3" fill="none"/>
      <circle cx="5" cy="7" r="2.1" fill="currentColor"/><circle cx="5" cy="17" r="2.1" fill="currentColor"/>
      <circle cx="19" cy="7" r="2.1" fill="currentColor"/><circle cx="19" cy="17" r="2.1" fill="currentColor"/>
      <circle cx="12" cy="12" r="2.4" fill="currentColor"/>
    </symbol>
    <symbol id="pf-i-chart" viewBox="0 0 24 24">
      <path d="M2,21 L2,3 M2,21 L22,21" stroke="currentColor" stroke-width="1.4" fill="none" stroke-linecap="round"/>
      <polyline points="4,17 9,13 13,15 18,6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M18,6 L22,2.3" stroke="currentColor" stroke-width="1.6" stroke-dasharray="1.5 2.2" stroke-linecap="round"/>
      <circle cx="18" cy="6" r="1.8" fill="currentColor"/>
    </symbol>
    <symbol id="pf-i-heartmon" viewBox="0 0 24 24">
      <rect x="2" y="6" width="20" height="13" rx="2.2" fill="none" stroke="currentColor" stroke-width="1.5"/>
      <polyline points="4,12.5 8,12.5 10,8 13,17 15,12.5 20,12.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
  </defs>

  <rect x="1" y="1" width="998" height="738" rx="20" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>

  <g font-family="Segoe UI, -apple-system, Arial, sans-serif">
    <rect x="36" y="24" width="230" height="24" rx="12" fill="#eff6ff" stroke="#bfdbfe"/>
    <circle cx="52" cy="36" r="3.5" fill="#2563eb"/>
    <text x="64" y="40" font-size="10.5" letter-spacing="1.5" fill="#1e40af">ECG FORECASTING · FLUJO</text>

    <!-- connecting spine -->
    <line x1="500" y1="86" x2="500" y2="664" stroke="#f1f5f9" stroke-width="10"/>

    <!-- Step 1: Historial -->
    <g transform="translate(50,86)" filter="url(#pf-shadow)">
      <rect width="900" height="104" rx="14" fill="#f8fafc" stroke="#2563eb" stroke-width="1.5"/>
      <circle cx="52" cy="52" r="26" fill="#eff6ff"/>
      <use href="#pf-i-pulse" x="40" y="40" width="24" height="24" color="#2563eb"/>
      <text x="100" y="44" font-size="15" font-weight="700" fill="#0f172a">1 · HISTORIAL DE ENTRADA</text>
      <text x="100" y="68" font-size="12" fill="#475569">Historial L = 5 latidos anteriores segmentados (256 muestras/latido)</text>
      <text x="100" y="87" font-size="12" fill="#475569">+ Intervalo RR normalizado (dim = 257)</text>
    </g>

    <line x1="500" y1="190" x2="500" y2="222" stroke="#64748b" stroke-width="2" marker-end="url(#pf-arrow)"/>

    <!-- Step 2: Modelos -->
    <g transform="translate(50,230)" filter="url(#pf-shadow)">
      <rect width="900" height="130" rx="14" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
      <circle cx="52" cy="50" r="26" fill="#e0e7ff"/>
      <use href="#pf-i-network" x="40" y="38" width="24" height="24" color="#4338ca"/>
      <text x="100" y="42" font-size="15" font-weight="700" fill="#0f172a">2 · MODELOS DE FORECASTING</text>
      <text x="100" y="60" font-size="11.5" fill="#4338ca">Pronóstico morfológico secuencial (no clasificación post-evento)</text>

      <rect x="20" y="78" width="390" height="38" rx="9" fill="#ffffff" stroke="#c7d2fe"/>
      <text x="215" y="97" font-size="11.5" font-weight="700" fill="#334155" text-anchor="middle">ML Clásico</text>
      <text x="215" y="112" font-size="9.8" fill="#64748b" text-anchor="middle">Persistencia · ARIMA · RF · MLP</text>

      <line x1="420" y1="97" x2="470" y2="97" stroke="#4f46e5" stroke-width="2" marker-end="url(#pf-arrowSmall)"/>

      <rect x="490" y="78" width="390" height="38" rx="9" fill="#ffffff" stroke="#c7d2fe"/>
      <text x="685" y="97" font-size="11.5" font-weight="700" fill="#334155" text-anchor="middle">Deep Learning</text>
      <text x="685" y="112" font-size="9.8" fill="#64748b" text-anchor="middle">LSTM · GRU · CNN-GRU + Atención (LOPO)</text>
    </g>

    <line x1="500" y1="360" x2="500" y2="392" stroke="#64748b" stroke-width="2" marker-end="url(#pf-arrow)"/>

    <!-- Step 3: Prediccion -->
    <g transform="translate(50,400)" filter="url(#pf-shadow)">
      <rect width="900" height="104" rx="14" fill="#fff1f2" stroke="#e11d48" stroke-width="1.5"/>
      <circle cx="52" cy="52" r="26" fill="#ffe4e6"/>
      <use href="#pf-i-chart" x="40" y="40" width="24" height="24" color="#e11d48"/>
      <text x="100" y="44" font-size="15" font-weight="700" fill="#0f172a">3 · PREDICCIÓN DE LATIDOS FUTUROS</text>
      <text x="100" y="68" font-size="12" fill="#be123c">Morfología completa: onda P · complejo QRS · onda T</text>
      <text x="100" y="87" font-size="12" fill="#be123c">Horizonte multi-step H ∈ {1, 2, 3} latidos hacia adelante</text>
    </g>

    <line x1="500" y1="504" x2="500" y2="536" stroke="#64748b" stroke-width="2" marker-end="url(#pf-arrow)"/>

    <!-- Step 4: Deteccion -->
    <g transform="translate(50,544)" filter="url(#pf-shadow)">
      <rect width="900" height="120" rx="14" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
      <circle cx="52" cy="55" r="26" fill="#d1fae5"/>
      <use href="#pf-i-heartmon" x="40" y="43" width="24" height="24" color="#059669"/>
      <text x="100" y="46" font-size="15" font-weight="700" fill="#0f172a">4 · RESIDUO Y ANÁLISIS</text>
      <text x="100" y="70" font-size="12" fill="#047857">Error entre la previsión y la señal real, latido a latido</text>
      <text x="100" y="89" font-size="12" fill="#047857">Tablero interactivo de análisis · FastAPI + React</text>
    </g>

    <text x="920" y="722" font-size="9" letter-spacing="1.5" fill="#cbd5e1" text-anchor="end">ECG FORECASTING</text>
  </g>
</svg>
