<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 220" width="100%" height="220" role="img" aria-label="Animación: barrido de un electrocardiograma con el historial de 5 latidos más intervalo RR, pasando por el modelo CNN-GRU con atención, hacia el pronóstico de los 3 latidos futuros." style="background:#ffffff; border-radius:14px; border:1px solid #e2e8f0; box-shadow:0 4px 14px rgba(15,23,42,0.06);">
  <style id="tema-oscuro-generado">
    /* La paleta clara queda intacta: aqui solo se reasigna cuando el
       navegador informa de que el tema del sistema es oscuro. */
    @media (prefers-color-scheme: dark) {
      [fill="#16a34a"]  { fill:   #4ade80; }
      [stroke="#16a34a"]{ stroke: #4ade80; }
      [fill="#1d4ed8"]  { fill:   #60a5fa; }
      [stroke="#1d4ed8"]{ stroke: #60a5fa; }
      [fill="#1e40af"]  { fill:   #60a5fa; }
      [stroke="#1e40af"]{ stroke: #60a5fa; }
      [fill="#4338ca"]  { fill:   #8b8ff0; }
      [stroke="#4338ca"]{ stroke: #8b8ff0; }
      [fill="#64748b"]  { fill:   #8b949e; }
      [stroke="#64748b"]{ stroke: #8b949e; }
      [fill="#94a3b8"]  { fill:   #768390; }
      [stroke="#94a3b8"]{ stroke: #768390; }
      [fill="#be123c"]  { fill:   #fb7185; }
      [stroke="#be123c"]{ stroke: #fb7185; }
      [fill="#bfdbfe"]  { fill:   #2d4a73; }
      [stroke="#bfdbfe"]{ stroke: #2d4a73; }
      [fill="#c7d2fe"]  { fill:   #3b4270; }
      [stroke="#c7d2fe"]{ stroke: #3b4270; }
      [fill="#e11d48"]  { fill:   #fb7185; }
      [stroke="#e11d48"]{ stroke: #fb7185; }
      [fill="#eef2ff"]  { fill:   #1a1d2e; }
      [stroke="#eef2ff"]{ stroke: #1a1d2e; }
      [fill="#eff6ff"]  { fill:   #172033; }
      [stroke="#eff6ff"]{ stroke: #172033; }
      [fill="#f1f5f9"]  { fill:   #21262d; }
      [stroke="#f1f5f9"]{ stroke: #21262d; }
      [fill="#fecdd3"]  { fill:   #5c2a33; }
      [stroke="#fecdd3"]{ stroke: #5c2a33; }
      [fill="#fff1f2"]  { fill:   #2b1418; }
      [stroke="#fff1f2"]{ stroke: #2b1418; }
      [fill="#ffffff"]  { fill:   #161b22; }
      [stroke="#ffffff"]{ stroke: #161b22; }
      svg, :root { background: #161b22 !important; }
    }
  </style>
  <style>
    /* El recorrido es la longitud REAL del trazado, medida con
       getTotalLength(): 762.5, no los 900 que habia. Con 900 el
       barrido terminaba al 84.7 por ciento del ciclo y los ultimos 0.54 s
       quedaban congelados antes de saltar al reinicio. */
    @keyframes sweepIn {
      0%   { stroke-dashoffset: 762.5; opacity: 1; }
      72%  { stroke-dashoffset: 0; opacity: 1; }
      /* Pausa deliberada: da tiempo a leer el latido ya trazado. */
      90%  { stroke-dashoffset: 0; opacity: 1; }
      /* El reinicio ocurre con la opacidad a cero, para que no se vea. */
      100% { stroke-dashoffset: 0; opacity: 0; }
    }
    @keyframes marchOut { to { stroke-dashoffset: -28; } }
    @keyframes fadeSoft { 0%, 100% { opacity: 0.5; } 50% { opacity: 1; } }
    .ecg-in { stroke-dasharray: 762.5; animation: sweepIn 3.5s linear infinite; }
    .ecg-out { stroke-dasharray: 8 6; animation: marchOut 1s linear infinite; }
    .live-dot { animation: fadeSoft 2.4s ease-in-out infinite; }

    /* Quien pide menos movimiento ve el latido completo y quieto. La
       informacion es la misma; lo unico que se retira es la animacion. */
    @media (prefers-reduced-motion: reduce) {
      .ecg-in   { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .ecg-out  { animation: none; }
      .live-dot { animation: none; opacity: 1; }
    }
  </style>

  <rect width="900" height="220" rx="14" fill="#ffffff"/>
  <g stroke="#f1f5f9" stroke-width="1">
    <line x1="50" y1="0" x2="50" y2="220"/><line x1="150" y1="0" x2="150" y2="220"/>
    <line x1="250" y1="0" x2="250" y2="220"/><line x1="350" y1="0" x2="350" y2="220"/>
    <line x1="450" y1="0" x2="450" y2="220"/><line x1="550" y1="0" x2="550" y2="220"/>
    <line x1="650" y1="0" x2="650" y2="220"/><line x1="750" y1="0" x2="750" y2="220"/>
    <line x1="850" y1="0" x2="850" y2="220"/>
    <line x1="0" y1="55" x2="900" y2="55"/><line x1="0" y1="110" x2="900" y2="110"/><line x1="0" y1="165" x2="900" y2="165"/>
  </g>

  <g font-family="Segoe UI, -apple-system, Arial, sans-serif">
    <!-- kicker -->
    <g transform="translate(30, 36)">
      <circle cx="6" cy="6" r="4" fill="#16a34a" class="live-dot"/>
      <text x="16" y="10" fill="#1e40af" font-size="11" font-weight="700" letter-spacing="1.5">PRONÓSTICO EN TIEMPO REAL</text>
    </g>

    <!-- Stage 1: Input -->
    <g transform="translate(50, 54)">
      <rect width="180" height="26" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
      <text x="90" y="17" text-anchor="middle" fill="#1e40af" font-size="11" font-weight="700" textLength="152" lengthAdjust="spacingAndGlyphs">Historial L = 5 latidos + RR</text>
    </g>

    <!-- Stage 2: Model -->
    <g transform="translate(419, 125)">
      <rect width="186" height="28" rx="6" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1"/>
      <text x="93" y="18" text-anchor="middle" fill="#4338ca" font-size="12" font-weight="700" textLength="158" lengthAdjust="spacingAndGlyphs">CNN-GRU + Atención</text>
    </g>

    <!-- Stage 3: Output -->
    <g transform="translate(670, 54)">
      <rect width="180" height="26" rx="6" fill="#fff1f2" stroke="#fecdd3" stroke-width="1"/>
      <text x="90" y="17" text-anchor="middle" fill="#be123c" font-size="11" font-weight="700" textLength="152" lengthAdjust="spacingAndGlyphs">Previsión H = 3 latidos</text>
    </g>

    <!-- Historical ECG trace (solid, sweeps in) -->
    <path d="M 30,150 L 70,150 Q 80,147 85,150 L 95,150 Q 100,135 105,150 L 115,150 L 120,165 L 128,85 L 138,185 L 145,150 L 155,150 Q 165,130 175,150 L 210,150 Q 220,147 225,150 L 235,150 Q 240,135 245,150 L 255,150 L 260,165 L 268,85 L 278,185 L 285,150 L 295,150 Q 305,130 315,150 L 350,150"
        fill="none" stroke="#1d4ed8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="ecg-in"/>

    <!-- transition arrows -->
    <g stroke="#94a3b8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <!-- Dos puntas cortas, una a cada lado de la etiqueta del modelo. Las dos
           flechas largas de antes median 40 y 75, y en el hueco de 256 que dejan
           los trazos no cabian sin invadirlos. -->
      <path d="M 390,139 L 410,139 M 404,134 L 410,139 L 404,144"/>
      <path d="M 613,139 L 634,139 M 628,134 L 634,139 L 628,144" opacity="0.75"/>
    </g>

    <!-- Forecast ECG trace (dashed, marches forward) -->
    <path d="M 640,150 L 665,150 Q 672,147 676,150 L 684,150 Q 688,137 692,150 L 700,150 L 704,163 L 711,92 L 719,180 L 725,150 L 733,150 Q 741,133 749,150 L 775,150 Q 782,147 786,150 L 794,150 Q 798,137 802,150 L 810,150 L 814,163 L 821,92 L 829,180 L 835,150 L 843,150 Q 851,133 859,150 L 870,150"
        fill="none" stroke="#e11d48" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="ecg-out"/>

    <!-- footer captions -->
    <g transform="translate(30, 200)">
      <text x="0" y="8" fill="#64748b" font-size="9.5">Entrada: 5 latidos segmentados (256 muestras) + RR normalizado</text>
      <text x="840" y="8" text-anchor="end" fill="#64748b" font-size="9.5">Pronóstico morfológico multi-step (H = 3)</text>
    </g>
  </g>
</svg>
