<svg viewBox="0 0 1160 760" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Arquitectura: el repositorio principal contiene notebooks, requirements y el dashboard. El dashboard es orquestado por Docker Compose, que levanta un backend FastAPI y un frontend React; el frontend llama al backend mediante peticiones HTTP a la ruta /api.">
  <style id="tema-oscuro-generado">
