      <path d="M9,14.5 L4.8,19.2 L9.3,17.3" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>
      <path d="M15,14.5 L19.2,19.2 L14.7,17.3" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>
