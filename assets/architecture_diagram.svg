          <text x="64" y="200" font-size="10.5" font-weight="700" fill="#0f172a" font-family="Consolas, Menlo, monospace">core/</text>
          <text x="64" y="216" font-size="9" fill="#64748b">Filtros · segmentación · inferencia LOPO</text>

          <rect x="20" y="234" width="410" height="46" rx="10" fill="#f0fdff" stroke="#cffafe"/>
