  <rect x="1" y="1" width="1158" height="758" rx="20" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>

  <g font-family="Segoe UI, -apple-system, Arial, sans-serif">
    <rect x="36" y="24" width="290" height="24" rx="12" fill="#eff6ff" stroke="#bfdbfe"/>
