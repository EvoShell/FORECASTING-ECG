      <circle cx="5.2" cy="6.5" r="0.8" fill="currentColor"/>
      <circle cx="7.6" cy="6.5" r="0.8" fill="currentColor"/>
      <circle cx="10" cy="6.5" r="0.8" fill="currentColor"/>
