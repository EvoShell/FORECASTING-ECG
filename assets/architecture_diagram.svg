      <path d="M6,12 H12 M12,12 L18,5 M12,12 L18,12 M12,12 L18,19" stroke="currentColor" stroke-width="1.3" fill="none"/>
      <circle cx="18" cy="5" r="1.6" fill="currentColor"/>
      <circle cx="18" cy="12" r="1.6" fill="currentColor"/>
      <circle cx="18" cy="19" r="1.6" fill="currentColor"/>
    </symbol>
