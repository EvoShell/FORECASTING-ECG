        <rect x="360" y="76" width="320" height="46" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
        <use href="#ad-i-doc" x="372" y="88" width="20" height="20" color="#2563eb"/>
        <text x="402" y="96" font-size="10.8" font-weight="700" fill="#0f172a" font-family="Consolas, Menlo, monospace">requirements.txt</text>
        <text x="402" y="111" font-size="9.2" fill="#64748b">Dependencias Python</text>

        <rect x="700" y="76" width="320" height="46" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
        <use href="#ad-i-doc" x="712" y="88" width="20" height="20" color="#2563eb"/>
        <text x="742" y="96" font-size="10.8" font-weight="700" fill="#0f172a" font-family="Consolas, Menlo, monospace">README.md</text>
