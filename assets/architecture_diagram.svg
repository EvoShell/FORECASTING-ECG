      <use href="#ad-i-folder" x="26" y="24" width="22" height="22" color="#2563eb"/>
      <text x="66" y="35" font-size="13" font-weight="700" fill="#0f172a">FORECASTING ECG</text>
      <text x="66" y="51" font-size="10.5" fill="#64748b">Repositorio principal · Investigación (Git)</text>

      <g filter="url(#ad-shadow)">
        <rect x="20" y="76" width="320" height="46" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
        <use href="#ad-i-layers" x="32" y="88" width="20" height="20" color="#2563eb"/>
