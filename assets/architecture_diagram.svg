          <text x="64" y="254" font-size="10.5" font-weight="700" fill="#0f172a" font-family="Consolas, Menlo, monospace">public/data/</text>
          <text x="64" y="270" font-size="9" fill="#64748b">Checkpoints &amp; resultados estadísticos curados</text>
