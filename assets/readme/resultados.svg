<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-label="Resultados de la validación LOPO sobre 123 registros, modelo base frente a calibrado: Coeficiente R² 0.6734 frente a 0.6797; Correlación de forma 0.8383 frente a 0.8429; Pliegues con R² ≥ 0.80 42.3% frente a 43.1%; RMSE 0.5139 frente a 0.5085; Deformación dinámica (DTW) 0.1355 frente a 0.1326. Residuo como indicador de evento: AUC-PR 0.3808 frente a una prevalencia de 0.1222, ganancia de 3.12 veces; precisión mediana entre pacientes 0.3123.">
